<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- tdJamaat mark: an eight-pointed star (Islamic geometry) holding a
       tunduk, the crown of the yurt from the Kyrgyz flag, inside a frame
       with kochkor-muyuz (ram's horn) curls in the corners. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26445a"/>
      <stop offset="1" stop-color="#132a38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c27e"/>
      <stop offset="1" stop-color="#b8853f"/>
    </linearGradient>
    <clipPath id="ring"><circle cx="32" cy="32" r="8.6"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="10" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.55"/>

  <g fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round">
    <path id="horn" d="M16.5 9 C12 9 9 12 9 16.5 C9 13.6 10.4 12.2 12.2 12.2 C13.6 12.2 14.2 13.6 13.2 14.6"/>
    <use href="#horn" transform="rotate(90 32 32)"/>
    <use href="#horn" transform="rotate(180 32 32)"/>
    <use href="#horn" transform="rotate(270 32 32)"/>
  </g>

  <g fill="url(#gold)">
    <rect x="18" y="18" width="28" height="28" rx="1.5"/>
    <rect x="18" y="18" width="28" height="28" rx="1.5" transform="rotate(45 32 32)"/>
  </g>

  <circle cx="32" cy="32" r="11.6" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="8.6" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <g clip-path="url(#ring)" fill="none" stroke="url(#gold)" stroke-width="1.35" stroke-linecap="round">
    <path d="M29 23 Q27.2 32 29 41"/>
    <path d="M32 23 V41"/>
    <path d="M35 23 Q36.8 32 35 41"/>
    <path d="M23 29 Q32 27.2 41 29"/>
    <path d="M23 32 H41"/>
    <path d="M23 35 Q32 36.8 41 35"/>
  </g>
</svg>
