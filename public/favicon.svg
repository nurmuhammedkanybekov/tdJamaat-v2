<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- tdJamaat mark: a crescent above a ram's horn (кочкор мүйүз, the Kyrgyz
       ornament of strength and plenty), in a gold ring on night black. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1e"/>
      <stop offset="1" stop-color="#09090a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4c88a"/>
      <stop offset="1" stop-color="#b8924a"/>
    </linearGradient>
    <mask id="cr" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <circle cx="64.5" cy="26.5" r="10.2" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="translate(3.2 3.2) scale(0.48)">
    <circle cx="60" cy="60" r="53" fill="none" stroke="url(#gold)" stroke-width="3.6"/>
    <g transform="translate(17 25) scale(0.86)" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 64 C50 42 58 28 71 25 C85 22 92 35 87 45 C82 54 70 53 70 45 C70 39 76 37 79 41"/>
      <path d="M50 64 C50 42 42 28 29 25 C15 22 8 35 13 45 C18 54 30 53 30 45 C30 39 24 37 21 41"/>
      <path d="M50 64 L50 88"/>
    </g>
    <circle cx="59" cy="30" r="12.5" fill="url(#gold)" mask="url(#cr)"/>
  </g>
</svg>
